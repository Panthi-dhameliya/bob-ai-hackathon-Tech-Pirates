submission:
  title: "InsightSetu"                            

  problem_statement: >                 
    Pharmaceutical drug safety teams struggle to identify emerging safety signals from millions of adverse-event reports,
    while regulatory teams must manually check large CTD dossiers for missing or incomplete sections. These challenges can
    delay important safety decisions and regulatory submissions.

  solution_summary: >                  
     We built an AI-powered platform that detects potential drug safety signals using adverse-event data and checks regulatory
    submission dossiers against ICH M4 CTD requirements. It provides safety insights, submission readiness scores, gap reports,
    and AI-assisted explanations to help pharmaceutical teams prioritize actions.

  key_features:                        
    - "Drug safety signal detection from adverse-event reports using PRR analysis"
    - "ICH M4 CTD-based regulatory submission completeness checking"
    - "Module-wise submission readiness scoring"
    - "Prioritized gap reports for missing or incomplete sections"
    - "AI Copilot for explaining findings and prioritizing actions"                   

   tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI"]
    ibm_technologies: ["watsonx.ai", "IBM Bob"]
    databases: []
    other: ["GitHub"]

  what_we_are_most_proud_of: >
    We are most proud of combining drug safety signal detection and regulatory submission readiness in one platform,
    with clear prioritization and AI-assisted explanations that help pharmaceutical teams understand what needs attention first.

    known_limitations: >
    The current solution is a hackathon prototype and has been tested with limited sample data rather than the full scale
    of real-world pharmaceutical datasets and regulatory dossiers. Further validation with larger datasets and production
    environments would be required before real-world deployment.

